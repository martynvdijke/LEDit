version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  install:
    desc: Install all dependencies (Go + Node + Playwright)
    cmds:
      - go mod download
      - npm install
      - npx playwright install --with-deps chromium

  assets:
    desc: Build frontend bundles and PWA icons
    cmds:
      - npm run build

  fmt:
    desc: Format code (Go)
    cmds:
      - go fmt ./...

  test:
    desc: Run Go unit and database tests
    cmds:
      - go test -v ./...

  test:py:
    desc: Run Python device library tests with coverage
    cmds:
      - pip install -e ./device[test]
      - python -m pytest device/tests -v --cov=ledit_device --cov-report=term --cov-report=html

  test:e2e:
    desc: Run Playwright end-to-end tests (chromium-desktop)
    cmds:
      - npx playwright test --project=chromium-desktop

  test:integration:
    desc: Run Python integration tests against ephemeral server
    cmds:
      - python -m pytest device/tests/integration -v

  test:all:
    desc: Run all test tiers (Go + Python + integration)
    cmds:
      - task: test
      - task: test:py
      - task: test:integration

  build:
    desc: Build the Go binary
    cmds:
      - task: assets
      - go build -o ledit .

  run:
    desc: Run the application
    cmds:
      - go run .

  dev:
    desc: Run with hot-reload (Air)
    cmds:
      - air

  docker:build:
    desc: Build Docker image
    cmds:
      - docker build . -t ledit:local

  clean:
    desc: Clean build artifacts and local database
    cmds:
      - rm -f ledit
      - rm -rf data/

  pre-push:
    desc: Run all checks before pushing
    cmds:
      - task: fmt
      - task: test
      - task: test:py
      - task: build

  all:
    desc: Run format, test, and build
    cmds:
      - task: fmt
      - task: test
      - task: build
