<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">LEDit matrix mark</title>
  <desc id="desc">A glowing phosphor-green L made from LED pixels inside a retro terminal panel.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#162b1d"/>
      <stop offset="1" stop-color="#07100b"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d5ff65"/>
      <stop offset="1" stop-color="#78c91c"/>
    </linearGradient>
    <filter id="green-glow" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cyan-glow" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="matrix" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="4" fill="#477151" opacity=".55"/>
    </pattern>
  </defs>

  <rect width="512" height="512" rx="96" fill="#050806"/>
  <rect x="16" y="16" width="480" height="480" rx="82" fill="url(#panel)" stroke="#203b29" stroke-width="4"/>
  <rect x="34" y="34" width="444" height="444" rx="68" fill="none" stroke="url(#edge)" stroke-width="6" opacity=".9"/>
  <rect x="56" y="56" width="400" height="400" rx="48" fill="#09150d" stroke="#294b32" stroke-width="3"/>
  <rect x="72" y="72" width="368" height="368" rx="36" fill="url(#matrix)" opacity=".62"/>

  <g fill="#203c28" opacity=".85">
    <circle cx="92" cy="92" r="7"/>
    <circle cx="420" cy="92" r="7"/>
    <circle cx="92" cy="420" r="7"/>
    <circle cx="420" cy="420" r="7"/>
  </g>

  <g aria-hidden="true">
    <rect x="106" y="99" width="14" height="14" rx="3" fill="#ffb000"/>
    <rect x="128" y="99" width="14" height="14" rx="3" fill="#b7ff35"/>
    <rect x="150" y="99" width="14" height="14" rx="3" fill="#4de8ff"/>
    <path d="M190 106h182" stroke="#31593a" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 14"/>
  </g>

  <g fill="#b7ff35" filter="url(#green-glow)" shape-rendering="crispEdges">
    <rect x="128" y="172" width="26" height="26" rx="5"/>
    <rect x="128" y="214" width="26" height="26" rx="5"/>
    <rect x="128" y="256" width="26" height="26" rx="5"/>
    <rect x="128" y="298" width="26" height="26" rx="5"/>
    <rect x="128" y="340" width="26" height="26" rx="5"/>
    <rect x="128" y="382" width="26" height="26" rx="5"/>
    <rect x="170" y="382" width="26" height="26" rx="5"/>
    <rect x="212" y="382" width="26" height="26" rx="5"/>
    <rect x="254" y="382" width="26" height="26" rx="5"/>
    <rect x="296" y="382" width="26" height="26" rx="5"/>
  </g>

  <g fill="#4de8ff" filter="url(#cyan-glow)" shape-rendering="crispEdges">
    <rect x="352" y="214" width="26" height="26" rx="5"/>
    <rect x="394" y="256" width="26" height="26" rx="5"/>
    <rect x="352" y="298" width="26" height="26" rx="5"/>
    <rect x="310" y="340" width="26" height="26" rx="5"/>
  </g>

  <path d="M336 353h26v26h26" fill="none" stroke="#4de8ff" stroke-width="5" stroke-linecap="square" opacity=".75"/>
  <path d="M102 438h116" stroke="#b7ff35" stroke-width="3" stroke-linecap="round" opacity=".55"/>
  <path d="M382 438h42" stroke="#ffb000" stroke-width="3" stroke-linecap="round" opacity=".8"/>
</svg>
