<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEDit - Settings</title>
    <link rel="stylesheet" href="/static/assets/styles.css">
</head>
<body>
    <div class="d-flex">
        {{template "sidebar" .}}
        <div class="container-fluid p-4">
            <h1>General Settings</h1>
            <form method="POST" action="/admin/settings" class="mt-4">
                <div class="mb-3">
                    <label for="timeout" class="form-label">Timeout (seconds)</label>
                    <input type="number" step="0.1" class="form-control" id="timeout" name="timeout" value="{{if .settings}}{{.settings.Timeout}}{{else}}5{{end}}" required>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="random" name="random">
                    <label for="random" class="form-check-label">Random order</label>
                </div>
                <div class="mb-3">
                    <label for="width" class="form-label">Matrix Width</label>
                    <input type="number" class="form-control" id="width" name="width" value="{{if .settings}}{{.settings.Width}}{{else}}64{{end}}">
                </div>
                <div class="mb-3">
                    <label for="height" class="form-label">Matrix Height</label>
                    <input type="number" class="form-control" id="height" name="height" value="{{if .settings}}{{.settings.Height}}{{else}}64{{end}}">
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="eink_mode" name="eink_mode"{{if and .settings .settings.EinkMode}} checked{{end}}>
                    <label for="eink_mode" class="form-check-label">E-Ink Mode (default for new visitors)</label>
                </div>
                <div class="mb-3">
                    <label for="transition_style" class="form-label">Transition style</label>
                    <select class="form-control" id="transition_style" name="transition_style">
                        <option value="none"{{if and .settings (eq .settings.TransitionStyle "none")}} selected{{end}}>None</option>
                        <option value="fade"{{if and .settings (eq .settings.TransitionStyle "fade")}} selected{{end}}>Fade</option>
                        <option value="wipe"{{if and .settings (eq .settings.TransitionStyle "wipe")}} selected{{end}}>Wipe</option>
                        <option value="dissolve"{{if and .settings (eq .settings.TransitionStyle "dissolve")}} selected{{end}}>Dissolve</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="transition_ms" class="form-label">Transition duration (ms)</label>
                    <input type="number" class="form-control" id="transition_ms" name="transition_ms" min="100" max="2000" value="{{if .settings}}{{.settings.TransitionMs}}{{else}}500{{end}}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Ordering mode</label><br>
                    <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="ordering_mode" id="ordering_sequential" value="sequential" {{if and .settings (eq .settings.OrderingMode "sequential")}}checked{{end}}><label class="form-check-label" for="ordering_sequential">Sequential</label></div>
                    <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="ordering_mode" id="ordering_random" value="random" {{if or (not .settings) (eq .settings.OrderingMode "random")}}checked{{end}}><label class="form-check-label" for="ordering_random">Random</label></div>
                    <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="ordering_mode" id="ordering_adaptive" value="adaptive" {{if and .settings (eq .settings.OrderingMode "adaptive")}}checked{{end}}><label class="form-check-label" for="ordering_adaptive">Adaptive</label></div>
                </div>
                <div id="adaptive-disclosure" style="display:none;" class="border p-3 mb-3">
                    <h5>Adaptive tuning</h5>
                    <div class="mb-2"><label>Half-life (days, 1-30)</label><input type="number" class="form-control" name="adaptive_half_life_days" value="{{if .settings}}{{.settings.AdaptiveHalfLifeDays}}{{else}}7{{end}}"></div>
                    <div class="mb-2"><label>Window (days, 1-90)</label><input type="number" class="form-control" name="adaptive_window_days" value="{{if .settings}}{{.settings.AdaptiveWindowDays}}{{else}}14{{end}}"></div>
                    <div class="mb-2"><label>Floor (0-0.2)</label><input type="number" step="0.01" class="form-control" name="adaptive_floor" value="{{if .settings}}{{.settings.AdaptiveFloor}}{{else}}0.05{{end}}"></div>
                    <div class="mb-2"><label>Exploration ε (0-0.5)</label><input type="number" step="0.01" class="form-control" name="adaptive_epsilon" value="{{if .settings}}{{.settings.AdaptiveEpsilon}}{{else}}0.15{{end}}"></div>
                    <small class="text-muted">changes recompute within minutes</small>
                </div>
                <script>document.querySelectorAll('input[name="ordering_mode"]').forEach(r=>r.addEventListener('change',()=>{document.getElementById('adaptive-disclosure').style.display=document.getElementById('ordering_adaptive').checked?'block':'none'}));document.getElementById('adaptive-disclosure').style.display=document.getElementById('ordering_adaptive').checked?'block':'none';</script>
                <button type="submit" class="btn btn-primary">Save</button>
            </form>
        </div>
    </div>
</body><script type="module" src="/static/assets/app.js"></script>
</html>
