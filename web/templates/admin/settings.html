<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEDit - Settings</title>
    <link rel="stylesheet" href="/static/assets/styles.css">
</head>
<body>
    <div class="d-flex">
        {{template "sidebar" .}}
        <div class="container-fluid p-4">
            <h1>General Settings</h1>
            <form method="POST" action="/admin/settings" class="mt-4">
                <div class="mb-3">
                    <label for="timeout" class="form-label">Timeout (seconds)</label>
                    <input type="number" step="0.1" class="form-control" id="timeout" name="timeout" value="{{if .settings}}{{.settings.Timeout}}{{else}}5{{end}}" required>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="random" name="random">
                    <label for="random" class="form-check-label">Random order</label>
                </div>
                <div class="mb-3">
                    <label for="width" class="form-label">Matrix Width</label>
                    <input type="number" class="form-control" id="width" name="width" value="{{if .settings}}{{.settings.Width}}{{else}}64{{end}}">
                </div>
                <div class="mb-3">
                    <label for="height" class="form-label">Matrix Height</label>
                    <input type="number" class="form-control" id="height" name="height" value="{{if .settings}}{{.settings.Height}}{{else}}64{{end}}">
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="eink_mode" name="eink_mode"{{if and .settings .settings.EinkMode}} checked{{end}}>
                    <label for="eink_mode" class="form-check-label">E-Ink Mode (default for new visitors)</label>
                </div>
                <div class="mb-3">
                    <label for="transition_style" class="form-label">Transition style</label>
                    <select class="form-control" id="transition_style" name="transition_style">
                        <option value="none"{{if and .settings (eq .settings.TransitionStyle "none")}} selected{{end}}>None</option>
                        <option value="fade"{{if and .settings (eq .settings.TransitionStyle "fade")}} selected{{end}}>Fade</option>
                        <option value="wipe"{{if and .settings (eq .settings.TransitionStyle "wipe")}} selected{{end}}>Wipe</option>
                        <option value="dissolve"{{if and .settings (eq .settings.TransitionStyle "dissolve")}} selected{{end}}>Dissolve</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="transition_ms" class="form-label">Transition duration (ms)</label>
                    <input type="number" class="form-control" id="transition_ms" name="transition_ms" min="100" max="2000" value="{{if .settings}}{{.settings.TransitionMs}}{{else}}500{{end}}">
                </div>
                <button type="submit" class="btn btn-primary">Save</button>
            </form>
        </div>
    </div>
</body><script type="module" src="/static/assets/app.js"></script>
</html>
