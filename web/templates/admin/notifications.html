<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEDit - Notifications</title>
    <link rel="stylesheet" href="/static/assets/styles.css">
</head>
<body>
    <div class="d-flex">
        {{template "sidebar" .}}
        <div class="container-fluid p-4">
            <h1>Notifications</h1>
            <form method="GET" class="row g-2 mt-2">
                <div class="col-auto"><input name="kind" value="{{.filter_kind}}" placeholder="kind" class="form-control form-control-sm"></div>
                <div class="col-auto"><input name="priority_min" value="{{.filter_prio}}" placeholder="priority_min" class="form-control form-control-sm"></div>
                <div class="col-auto"><input name="unread_for" value="{{.filter_unread}}" placeholder="unread_for device id" class="form-control form-control-sm"></div>
                <div class="col-auto"><button class="btn btn-sm btn-primary">Filter</button></div>
            </form>
            <table class="table table-striped mt-3">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Message</th>
                        <th>Time</th>
                    </tr>
                </thead>
                <tbody>
                    {{range .notifications}}
                    <tr>
                        <td>{{.ID}}</td>
                        <td>{{.Title}}</td>
                        <td>{{.Message}}</td>
                        <td>{{.Time}}</td>
                    </tr>
                    {{else}}
                    <tr>
                        <td colspan="4" class="text-muted">No notifications yet.</td>
                    </tr>
                    {{end}}
                </tbody>
            </table>
        </div>
    </div>
</body><script type="module" src="/static/assets/app.js"></script>
</html>
