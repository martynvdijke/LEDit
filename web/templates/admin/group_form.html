<!DOCTYPE html><html><head><meta charset="UTF-8"><title>New Group</title><link rel="stylesheet" href="/static/assets/styles.css"></head><body><div class="d-flex">{{template "sidebar" .}}<div class="container-fluid p-4"><h1>New Group</h1><form method="POST" action="/admin/groups/new"><div class="mb-3"><label>Name</label><input name="name" class="form-control"></div><div class="mb-3"><label>Description</label><input name="description" class="form-control"></div><div class="mb-3"><label>Content Mode</label><select name="content_mode" class="form-select"><option value="global">Global</option><option value="playlist">Playlist</option><option value="scheduled">Scheduled</option></select></div><div class="mb-3"><label>Playlist ID</label><select name="playlist_id" class="form-select"><option value="">— No playlist —</option>{{range .playlists}}<option value="{{.ID}}">{{.Name}}</option>{{end}}</select></div><input type="hidden" name="scheduled_playlist_ids" value="[]"><div class="mb-3"><label>Fallback playlist</label><select name="fallback_playlist_id" class="form-select"><option value="">— No fallback —</option>{{range .playlists}}<option value="{{.ID}}">{{.Name}}</option>{{end}}</select></div><button class="btn btn-primary">Create</button></form></div></div><script type="module" src="/static/assets/app.js"></script></body></html>
