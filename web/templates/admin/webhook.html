<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEDit - Webhook Settings</title>
    <link rel="stylesheet" href="/static/assets/styles.css">
</head>
<body>
    <div class="d-flex">
        {{template "sidebar" .}}
        <div class="container-fluid p-4">
            <h1>Webhook Settings</h1>
            {{if and .settings (eq .settings.APIKey "")}}
            <div class="alert alert-warning">API key is empty — /api endpoints are unauthenticated</div>
            {{else if not .settings}}
            <div class="alert alert-warning">API key is empty — /api endpoints are unauthenticated</div>
            {{end}}
            <form method="POST" action="/admin/webhook" class="mt-4">
                <div class="mb-3">
                    <label for="api_key" class="form-label">API Key</label>
                    <input type="text" class="form-control" id="api_key" name="api_key" value="{{if .settings}}{{.settings.APIKey}}{{end}}">
                </div>
                <div class="mb-3">
                    <label for="default_ttl" class="form-label">Default TTL (seconds)</label>
                    <input type="number" class="form-control" id="default_ttl" name="default_ttl" value="{{if .settings}}{{.settings.DefaultTTL}}{{else}}30{{end}}" min="1" max="3600">
                </div>
                <button type="submit" class="btn btn-primary">Save Settings</button>
            </form>
        </div>
    </div>
</body><script type="module" src="/static/assets/app.js"></script>
</html>
