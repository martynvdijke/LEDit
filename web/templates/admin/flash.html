{{define "flash"}}
{{if .flash_message}}
<div class="alert alert-{{if eq .flash_type "danger"}}danger{{else if eq .flash_type "success"}}success{{else}}info{{end}}" role="alert">
    <span>{{.flash_message}}</span>
    <button type="button" class="btn btn-ghost" data-dismiss aria-label="Dismiss notification">×</button>
</div>
{{end}}
{{end}}
