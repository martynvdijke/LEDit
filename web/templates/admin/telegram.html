<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEDit - Telegram Settings</title>
    <link rel="stylesheet" href="/static/assets/styles.css">
</head>
<body>
    <div class="d-flex">
        {{template "sidebar" .}}
        <div class="container-fluid p-4">
            <h1>Telegram Settings</h1>
            {{if .error}}<div class="alert alert-danger">{{.error}}</div>{{end}}
            <form method="POST" action="/admin/telegram" class="mt-4">
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="enabled" name="enabled" {{if and .settings .settings.Enabled}}checked{{end}}>
                    <label for="enabled" class="form-check-label">Enabled</label>
                </div>
                <div class="mb-3">
                    <label for="bot_token" class="form-label">Bot Token</label>
                    <input type="password" class="form-control" id="bot_token" name="bot_token" value="{{if .settings}}{{.settings.BotToken}}{{end}}">
                </div>
                <div class="mb-3">
                    <label for="allowed_chat_id" class="form-label">Allowed Chat ID</label>
                    <input type="number" class="form-control" id="allowed_chat_id" name="allowed_chat_id" value="{{if .settings}}{{.settings.AllowedChatID}}{{end}}">
                </div>
                {{if and .settings .settings.Enabled (eq .settings.AllowedChatID 0)}}
                <div class="alert alert-warning">Any chat will be able to control the display</div>
                {{end}}
                <button type="submit" class="btn btn-primary">Save Settings</button>
            </form>
        </div>
    </div>
</body><script type="module" src="/static/assets/app.js"></script>
</html>
