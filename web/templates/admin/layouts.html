<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEDit - Visual Layouts</title>
    <link rel="stylesheet" href="/static/assets/styles.css">
</head>
<body>
    <div class="d-flex">
        {{template "sidebar" .}}
        <div class="container-fluid p-4">
            <div class="d-flex justify-content-between align-items-center">
                <h1>Visual Layouts</h1>
                <a href="/admin/layouts/new" class="btn btn-primary">New Layout</a>
            </div>
            {{if .layouts}}
            <table class="table table-striped mt-3">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Enabled</th>
                        <th>Background</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {{range .layouts}}
                    <tr>
                        <td>{{.ID}}</td>
                        <td>{{.Name}}</td>
                        <td>{{if .Enabled}}<span class="badge bg-success">on</span>{{else}}<span class="badge bg-secondary">off</span>{{end}}</td>
                        <td><span class="badge bg-dark" style="background:{{.Background}}">{{.Background}}</span></td>
                        <td>
                            <a href="/admin/layouts/{{.ID}}/edit" class="btn btn-sm btn-primary">Open editor</a>
                            <form method="POST" action="/admin/layouts/{{.ID}}/delete" style="display:inline">
                                <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                            </form>
                        </td>
                    </tr>
                    {{end}}
                </tbody>
            </table>
            {{else}}
            <p class="text-muted mt-4">No layouts yet. <a href="/admin/layouts/new">Create one</a> to arrange regions visually.</p>
            {{end}}
        </div>
    </div>
</body>
<script type="module" src="/static/assets/app.js"></script>
</html>
