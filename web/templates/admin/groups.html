<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Groups</title><link rel="stylesheet" href="/static/assets/styles.css"></head><body><div class="d-flex">{{template "sidebar" .}}<div class="container-fluid p-4"><h1>Groups</h1><a href="/admin/groups/new" class="btn btn-primary mb-3">New Group</a><table class="table"><thead><tr><th>ID</th><th>Name</th><th>Description</th><th>Members</th><th>Actions</th></tr></thead><tbody>{{range .groups}}<tr><td>{{.ID}}</td><td>{{.Name}}</td><td>{{.Description}}</td><td>{{.MemberCount}}</td><td><a href="/admin/groups/{{.ID}}" class="btn btn-sm btn-primary">View</a></td></tr>{{else}}<tr><td colspan="5">No groups</td></tr>{{end}}</tbody></table></div></div><script type="module" src="/static/assets/app.js"></script></body></html>
