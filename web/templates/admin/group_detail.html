<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Group {{.group.Name}}</title><link rel="stylesheet" href="/static/assets/styles.css"></head><body><div class="d-flex">{{template "sidebar" .}}<div class="container-fluid p-4"><h1>{{.group.Name}}</h1><p>{{.group.Description}}</p><form method="POST" action="/admin/groups/{{.group.ID}}"><input name="name" value="{{.group.Name}}" class="form-control mb-2"><input name="description" value="{{.group.Description}}" class="form-control mb-2"><button class="btn btn-primary">Update</button></form><h3>Members</h3><table class="table"><tbody>{{range .members}}<tr><td>{{.Name}}</td><td><form method="POST" action="/api/groups/{{$.group.ID}}/members/{{.ID}}/remove"><button>Remove</button></form></td></tr>{{else}}<tr><td>No members</td></tr>{{end}}</tbody></table><form method="POST" action="/api/groups/{{.group.ID}}/members"><select name="device_id">{{range .devices}}<option value="{{.ID}}">{{.Name}}</option>{{end}}</select><button>Add member</button></form></div></div><script type="module" src="/static/assets/app.js"></script></body></html>
