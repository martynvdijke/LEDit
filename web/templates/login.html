<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEDit - Login</title>
    <link rel="stylesheet" href="/static/assets/styles.css">
</head>
<body class="bg-dark">
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="card" style="width: 400px;">
            <div class="card-body">
                <img src="/static/brand/ledit-lockup-light.svg" class="ledit-login-brand d-block" alt="LEDit">
                <h1 class="card-title text-center mb-4">LEDit Login</h1>
                {{if .error}}<div class="alert alert-danger">{{.error}}</div>{{end}}
                {{if .info}}<div class="alert alert-success">{{.info}}</div>{{end}}
                <form method="POST" action="/login">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
<input type="text" class="form-control" id="username" name="username" required autocomplete="username">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
                <p class="text-center mt-3 mb-0">
                    <a href="/forgot-password">Forgot password?</a>
                </p>
            </div>
        </div>
    </div>
</body><script type="module" src="/static/assets/app.js"></script>
</html>
