<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Send to LEDit</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #08130d; color: #e8f5ee; display: flex; justify-content: center; padding: 24px 16px; }
        .card { width: 100%; max-width: 420px; background: #12251b; border: 1px solid #1f3a2c; border-radius: 16px; padding: 24px; text-align: center; }
        h1 { font-size: 1.35rem; margin: 0 0 16px; }
        input[type="file"] { width: 100%; font-size: 1rem; padding: 14px; border-radius: 12px; border: 1px solid #1f3a2c; background: #0d1d15; color: inherit; margin-bottom: 12px; }
        img[data-frame-preview] { width: 100%; max-height: 320px; object-fit: contain; border-radius: 12px; background: #0d1d15; border: 1px solid #1f3a2c; display: none; margin-bottom: 12px; }
        img[data-frame-preview][src] { display: block; }
        button[data-frame-upload] { width: 100%; font-size: 1.1rem; font-weight: 600; padding: 16px; min-height: 56px; border-radius: 14px; border: 1px solid #1f3a2c; background: #1a4d32; color: #e8f5ee; cursor: pointer; }
        button[data-frame-upload]:disabled { opacity: 0.45; cursor: not-allowed; }
        button[data-frame-upload]:active:not(:disabled) { background: #236843; }
        [data-frame-status] { min-height: 1.3rem; margin: 12px 0 0; font-size: 0.92rem; }
        [data-frame-status].error { color: #ff9a9a; }
        [data-frame-status].ok { color: #8fe6b0; }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
    </style>
</head>
<body>
    <main class="card">
        <h1>Send Photo</h1>
        <input type="file" accept="image/*" capture="environment" data-frame-file>
        <img data-frame-preview alt="Preview">
        <button type="button" data-frame-upload disabled>Upload</button>
        <p role="status" data-frame-status></p>
    </main>
    <script type="module" src="/static/assets/frame.js"></script>
</body>
</html>
