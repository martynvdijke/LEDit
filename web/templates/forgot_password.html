<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEDit - Forgot Password</title>
    <link rel="stylesheet" href="/static/assets/styles.css">
</head>
<body class="bg-dark">
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="card" style="width: 400px;">
            <div class="card-body">
                <h1 class="card-title text-center mb-4">Reset Password</h1>
                {{if .error}}<div class="alert alert-danger">{{.error}}</div>{{end}}
                {{if .info}}<div class="alert alert-success">{{.info}}</div>{{end}}
                <form method="POST" action="/forgot-password">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required autocomplete="username">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Email Reset Link</button>
                </form>
                <p class="text-center mt-3 mb-0">
                    <a href="/login">Back to login</a>
                </p>
            </div>
        </div>
    </div>
</body><script type="module" src="/static/assets/app.js"></script>
</html>
