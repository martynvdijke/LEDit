<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEDit · {{.title}}</title>
    <meta name="theme-color" content="#08130d">
    <meta name="description" content="LEDit LED matrix control room">
    <link rel="manifest" href="/static/pwa/manifest.json">
    <link rel="icon" href="/static/pwa/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/static/pwa/icon-180.png">
    <link rel="stylesheet" href="/static/assets/styles.css">
    {{if .umamiEnabled}}<script async defer src="{{.umamiEndpoint}}/script.js" data-website-id="{{.umamiWebsiteID}}" data-host-url="{{.umamiEndpoint}}"></script>{{end}}
    {{if .eink_mode}}<link rel="stylesheet" href="/static/eink.css">{{end}}
</head>
<body{{if .eink_mode}} class="eink-mode"{{end}}>
    <div class="app-shell" data-app-shell>
        {{template "sidebar" .}}
        <main class="main" id="main-content">
            <div class="main-inner">
                {{.body}}
            </div>
        </main>
    </div>
    <script type="module" src="/static/assets/app.js"></script>
</body>
</html>
