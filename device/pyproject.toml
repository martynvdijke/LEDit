[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledit"
dynamic = ["version"]
description = "LEDit device client: stream frames to an RGB LED matrix over WebSocket"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "Pillow>=9.0",
    "websocket-client>=1.5",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
    "opentelemetry-instrumentation-logging>=0.45b0",
]

[project.optional-dependencies]
test = ["pytest>=8","pytest-cov>=5","pytest-asyncio","websockets>=12"]
discovery = ["zeroconf>=0.132"]

[project.scripts]
ledit-device = "ledit_device.__main__:main"

[project.urls]
Homepage = "https://github.com/martynvdijke/LEDit"
Repository = "https://github.com/martynvdijke/LEDit"
Issues = "https://github.com/martynvdijke/LEDit/issues"

[tool.setuptools]
packages = ["ledit_device"]

[tool.setuptools.dynamic]
version = { attr = "ledit_device.__version__" }

[tool.pytest.ini_options]
markers = [
    "integration: hits an ephemeral LEDit server (run via task test:integration)",
]

[tool.coverage.run]
omit = ["device/tests/*"]
branch = true

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
