[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledit-device"
version = "1.0.0"
description = "LEDit device client: stream frames to an RGB LED matrix over WebSocket"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "Pillow>=9.0",
    "websocket-client>=1.5",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
    "opentelemetry-instrumentation-logging>=0.45b0",
]

[project.optional-dependencies]
test = ["pytest>=8","pytest-cov>=5","pytest-asyncio","websockets>=12"]

[project.scripts]
ledit-device = "ledit_device.__main__:main"

[tool.setuptools]
packages = ["ledit_device"]

[tool.coverage.run]
omit = ["device/tests/*"]
branch = true

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
